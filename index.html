<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none'><polygon points='20,4 34,13 20,20 6,13' fill='%23818cf8'/><polygon points='6,13 20,20 20,36 6,29' fill='%236366f1'/><polygon points='20,20 34,13 34,29 20,36' fill='%2306b6d4'/><circle cx='20' cy='20' r='2' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>PrismSQL — In-Browser Database Studio</title>
    <script>
      (function() {
        var theme = localStorage.getItem('sqlplayground_theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090a0f] text-slate-900 dark:text-[#e2e8f0] antialiased selection:bg-indigo-500/30 selection:text-indigo-600 dark:selection:text-indigo-200">
    <div id="root"></div>
    <script src="/sql-wasm.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
